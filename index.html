<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chord Roulette</title>
  <meta name="description" content="Roll a chord progression and play it as a 2-, 4- or 8-bar loop with drums.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=touch-pickers">
</head>
<body>
  <header class="site-header">
    <h1>Chord Roulette</h1>
  </header>

  <main>
    <section class="panel controls" aria-label="Loop settings">
      <div class="field">
        <details class="touch-picker" id="keyPicker" name="loop-picker" hidden>
          <summary>Key · <strong></strong></summary>
          <div class="choices"></div>
        </details>
        <label class="label" for="key">Key</label>
        <select id="key"></select>
        <div class="seg" id="mode" role="group" aria-label="Mode">
          <button type="button" data-v="major">Major</button>
          <button type="button" data-v="minor">Minor</button>
        </div>
      </div>
      <div class="field">
        <label class="label" for="bpm">BPM</label>
        <input type="range" id="bpm" min="50" max="180" step="1">
        <output id="bpmOut" for="bpm"></output>
      </div>
      <div class="field">
        <details class="touch-picker" id="stylePicker" name="loop-picker" hidden>
          <summary>Style · <strong></strong></summary>
          <div class="choices"></div>
        </details>
        <label class="label" for="style">Style</label>
        <select id="style">
          <optgroup label="Sustained">
            <option value="whole">Whole notes</option>
            <option value="pad">Pad</option>
          </optgroup>
          <optgroup label="Rhythmic">
            <option value="quarter">Quarter notes</option>
            <option value="eighth">Eighth notes</option>
            <option value="sync">Syncopation</option>
            <option value="offbeat">Offbeat</option>
            <option value="strum">Strum</option>
          </optgroup>
          <optgroup label="Arpeggios">
            <option value="arp">Arpeggio</option>
            <option value="arp3">Triplet arp</option>
            <option value="arp16">16th-note arp</option>
            <option value="alberti">Alberti bass</option>
          </optgroup>
        </select>
      </div>
      <div class="field">
        <span class="label">Bars</span>
        <div class="seg" id="barCount" role="group" aria-label="Bars">
          <button type="button" data-v="2">2</button>
          <button type="button" data-v="4">4</button>
          <button type="button" data-v="8">8</button>
        </div>
      </div>
      <div class="field">
        <details class="touch-picker" id="rhythmPicker" name="loop-picker" hidden>
          <summary>Drums · <strong></strong></summary>
          <div class="choices"></div>
        </details>
        <label class="label" for="rhythm">Drums</label>
        <select id="rhythm">
          <option value="none">Off</option>
          <optgroup label="Basic">
            <option value="eight">Straight 8ths</option>
            <option value="sixteen">Straight 16ths</option>
            <option value="four">Four on the floor</option>
            <option value="half">Half-time</option>
            <option value="shuffle">Shuffle</option>
          </optgroup>
          <optgroup label="Ballads">
            <option value="ballad">Ballad</option>
            <option value="triplet">Triplet ballad</option>
          </optgroup>
          <optgroup label="Dance &amp; hip-hop">
            <option value="disco">Disco</option>
            <option value="funk">Funk</option>
            <option value="hiphop">Hip-hop</option>
            <option value="trap">Trap</option>
            <option value="reggaeton">Reggaeton</option>
          </optgroup>
          <optgroup label="Jazz &amp; world">
            <option value="jazz">Jazz swing</option>
            <option value="bossa">Bossa nova</option>
            <option value="reggae">One-drop reggae</option>
          </optgroup>
        </select>
      </div>
    </section>

    <section class="actions">
      <button type="button" id="roll" class="btn primary" aria-label="Roll progression" title="Roll progression (R or Enter)">🎲</button>
      <button type="button" id="play" class="btn" aria-label="Play" title="Play (Space)">▶</button>
    </section>

    <section class="result" aria-live="polite">
      <div id="bars" class="bars"></div>
    </section>

    <details class="panel options">
      <summary>Options</summary>
      <div class="field">
        <span class="label">Chords</span>
        <div class="seg" id="color" role="group" aria-label="Chord types">
          <button type="button" data-v="triad">Triads</button>
          <button type="button" data-v="seventh">7ths</button>
          <button type="button" data-v="mix">Mix</button>
          <button type="button" data-v="rich">Extended</button>
        </div>
      </div>
      <div class="field">
        <span class="label">Outside key</span>
        <div class="seg" id="outside" role="group" aria-label="Out-of-key chords">
          <button type="button" data-v="0">Off</button>
          <button type="button" data-v="0.2">Some</button>
          <button type="button" data-v="0.45">More</button>
        </div>
      </div>
      <div class="field">
        <label class="check"><input type="checkbox" id="startTonic"> Start on tonic</label>
        <label class="check"><input type="checkbox" id="randomKey"> Random key</label>
      </div>
      <div class="field">
        <span class="label">Minor degrees</span>
        <div class="seg" id="minorRef" role="group" aria-label="Minor degrees">
          <button type="button" data-v="tonic">Tonic (Im)</button>
          <button type="button" data-v="relative">Relative (VIm)</button>
        </div>
      </div>
    </details>

    <details class="panel options">
      <summary>Diatonic chords</summary>
      <div id="diatonic" class="chips" title="Preview chord"></div>
    </details>

    <details class="panel options">
      <summary>History</summary>
      <div class="seg small" id="historyFilter" role="group" aria-label="History filter">
        <button type="button" data-v="all">All</button>
        <button type="button" data-v="fav" aria-label="Favorites" title="Favorites">★</button>
      </div>
      <ol id="history" class="history"></ol>
      <button type="button" id="clearHistory" class="btn ghost small" title="Keep current and favorites">Clear history</button>
    </details>
  </main>

  <footer class="site-footer">
    <details>
      <summary>Shortcuts</summary>
      <p><kbd>Space</kbd> Play / Stop · <kbd>Enter</kbd> / <kbd>R</kbd> Roll · <kbd>1</kbd>–<kbd>8</kbd> Lock bar</p>
    </details>
    <p>Inspired by <a href="https://github.com/liotier/AkaiMPC" target="_blank" rel="noopener">liotier/AkaiMPC</a> (Unlicense)</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/theory.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js?v=touch-pickers"></script>
</body>
</html>
